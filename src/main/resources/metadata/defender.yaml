group: io.kestra.plugin.microsoft365.defender
name: "defender"
title: "Microsoft Defender XDR"
description: "Tasks that read and update Microsoft Defender XDR alerts and incidents, run advanced hunting queries, and trigger workflows on new detections."
body: "Use the same Microsoft Graph app registration as the other Microsoft 365 tasks (tenant, client ID, client secret or certificate) with the SecurityAlert, SecurityIncident and ThreatHunting application permissions to list, get and update alerts and incidents, enrich them with KQL advanced hunting queries, and poll for new or updated alerts or incidents with a lookback and deduplication state in the namespace KV store. Trigger results are streamed to an ION file and exposed as uri and count."
videos: []
createdBy: "Kestra Core Team"
managedBy: "Kestra Core Team"
